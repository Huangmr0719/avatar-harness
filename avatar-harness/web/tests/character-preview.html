<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>澄 · 原创代码角色预览</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#e8ede9;color:#263c48;font:14px system-ui,sans-serif}main{height:100vh;position:relative}canvas{display:block}header{position:absolute;left:36px;top:28px;pointer-events:none}h1{font-size:28px;letter-spacing:.12em;margin:8px 0}p{line-height:1.8;margin:4px 0;color:#5b6c72}small{letter-spacing:.18em}footer{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;white-space:nowrap;background:#f9fbf8dd;padding:12px 16px;border:1px solid #c9d3ce;border-radius:8px}button{padding:8px 12px;border:1px solid #bbc9c3;background:#fff;color:#263c48;border-radius:4px;cursor:pointer}label{display:flex;align-items:center;gap:8px}input{width:95px}
</style>
<main id="stage"><header><small>PROCEDURAL CHARACTER / 01</small><h1>澄 CHENG</h1><p>原创几何 · 本地渲染 · 无贴图与外部模型</p><p>拖动查看侧面；下方按钮检查头部、眨眼和嘴型。</p></header><footer><button data-yaw="-.5">向右转头</button><button data-yaw="0">正面</button><button data-yaw=".5">向左转头</button><button id="blink">眨眼</button><label>张嘴<input id="mouth" type="range" min="0" max="1" step=".01" value="0"></label><button id="idle">待机</button></footer></main>
<script type="module">
  import * as THREE from 'three'
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
  import { animateChengIdle, setChengExpression } from '../src/characters/cheng.ts'
  const scene = new THREE.Scene(), renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setClearColor('#e8ede9')
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05
  document.querySelector('main').prepend(renderer.domElement)
  const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .01, 100)
  camera.position.set(0, .82, 3.02)
  const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, .77, 0); controls.enableDamping = true
  scene.add(new THREE.HemisphereLight('#ffffff', '#75918a', 2.1))
  const key = new THREE.DirectionalLight('#fff5e7', 2.5); key.position.set(-2, 3, 4); scene.add(key)
  const rim = new THREE.DirectionalLight('#a9dfe9', 1.4); rim.position.set(2, 2, -2); scene.add(rim)
  const { scene: model } = await new GLTFLoader().loadAsync('/models/cheng.glb'); scene.add(model)
  let idle = true, seconds = 0, previous = performance.now()
  const pose = ({ yaw = 0, mouth = 0, blink = 0 }) => {
    idle = false; model.getObjectByName('Head').rotation.set(0, yaw, 0)
    setChengExpression(model, 'jawOpen', mouth)
    setChengExpression(model, 'eyeBlinkLeft', blink); setChengExpression(model, 'eyeBlinkRight', blink)
    renderer.render(scene, camera)
  }
  document.querySelectorAll('[data-yaw]').forEach(button => button.onclick = () => pose({ yaw: Number(button.dataset.yaw) }))
  document.querySelector('#blink').onclick = () => { pose({ blink: 1 }); setTimeout(() => pose({}), 240) }
  document.querySelector('#mouth').oninput = event => pose({ mouth: Number(event.target.value) })
  document.querySelector('#idle').onclick = () => { pose({}); idle = true }
  function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix() }
  addEventListener('resize', resize); resize()
  renderer.setAnimationLoop(() => {
    const now = performance.now(); seconds += Math.min((now - previous) / 1000, .1); previous = now
    if (idle) animateChengIdle(model, seconds)
    controls.update(); renderer.render(scene, camera)
  })
  window.avatarPreview = { model, renderer, pose }
  document.body.dataset.ready = 'true'
</script>
</html>
