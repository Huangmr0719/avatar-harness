# Upstream OpenAvatarChat LAM configuration, Apache-2.0; see sources.lock.json.
default:
  logger:
    log_level: INFO
  service:
    host: 0.0.0.0
    port: 8282
    cert_file: ssl_certs/localhost.crt
    cert_key: ssl_certs/localhost.key
  chat_engine:
    model_root: models
    concurrent_limit: 5
    handler_search_path:
    - src/handlers
    handler_configs:
      LamClient:
        module: client/ws_lam_client/ws_lam_client_handler
        asset_path: lam_samples/barbara.zip
        connection_ttl: 900
        upstream_mode: ws
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.15
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
        volume_threshold: -30
      SenseVoice:
        enabled: true
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: iic/SenseVoiceSmall
      CosyVoice:
        enabled: true
        module: tts/bailian_tts/tts_handler_cosyvoice_bailian
        voice: longxiaocheng
        model_name: cosyvoice-v1
      LLMOpenAICompatible:
        enabled: true
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: qwen-plus
        enable_video_input: false
        history_length: 20
        system_prompt: 请你扮演一个 AI 助手，用简短的两三句对话来回答用户的问题，并在对话内容中加入合适的标点符号，不需要讨论标点符号相关的内容
        api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      LAM_Driver:
        module: avatar/lam/avatar_handler_lam_audio2expression
